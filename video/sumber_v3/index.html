  ctx.save();ctx.globalAlpha=.045;const gr=rnd(f);for(let i=0;i<400;i++){ctx.fillStyle=gr()>.5?'#fff':'#000';ctx.fillRect(gr()*W,gr()*H,2,2)}ctx.restore();
}
