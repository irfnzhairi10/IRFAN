</style></head><body><canvas id="c" width="1080" height="1920"></canvas>
<script>
const W=1080,H=1920,FPS=30;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let TL=null,ENV=null,IMG={};
const GOLD='#d9b261',GOLD2='#f3dc9a',BURG='#4a0f1c';
// ---------- helpers
function rnd(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const lerp=(a,b,t)=>a+(b-a)*t;
const seg=(t,a,b)=>clamp((t-a)/(b-a));
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function glow(x,y,r,c0,c1='rgba(0,0,0,0)'){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,c0);g.addColorStop(1,c1);ctx.fillStyle=g;ctx.fillRect(x-r,y-r,2*r,2*r)}
function vgrad(y0,y1,stops){const g=ctx.createLinearGradient(0,y0,0,y1);stops.forEach(([o,c])=>g.addColorStop(o,c));return g}
function envAt(t){const i=Math.floor(t*FPS);return ENV[i]||0}
function activeSeg(t){return TL.segs.find(s=>t>=s.start-0.05&&t<=s.end+0.1)}
function speaking(t,who){const s=activeSeg(t);return s&&s.who===who&&!s.silent?clamp(envAt(t)*1.1):0}
// ---------- saffron thread
function thread(x,y,len,ang,curl,w=6){
  ctx.save();ctx.translate(x,y);ctx.rotate(ang);
  const g=ctx.createLinearGradient(0,0,0,-len);g.addColorStop(0,'#b3200f');g.addColorStop(1,'#ff5a2b');
  ctx.strokeStyle=g;ctx.lineCap='round';ctx.lineWidth=w;
  ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(curl,-len*.5,curl*.4,-len);ctx.stroke();
  ctx.fillStyle='#ff6a33';ctx.beginPath();ctx.ellipse(curl*.4,-len,w*1.1,w*2.3,.2,0,7);ctx.fill();
  ctx.restore()}
// ---------- characters (bust)
const CH={
 AMIR:{shirt:'#7c8187',shirt2:'#5d6268',hair:'#17110e',skin:'#c58c5f',beard:true,bags:true},
 HAKIM:{shirt:'#1f8f8f',shirt2:'#166b6c',hair:'#1b1410',skin:'#cf9667',beard:false,bags:false}};
function person(who,cx,cy,s,mood,talk,t,face=0){
  const c=CH[who];ctx.save();ctx.translate(cx,cy+Math.sin(t*1.6+(who==='AMIR'?0:2))*4);ctx.scale(s,s);

  ctx.fillStyle=c.shirt;ctx.beginPath();ctx.moveTo(-250,330);ctx.quadraticCurveTo(-240,150,-110,128);ctx.lineTo(110,128);ctx.quadraticCurveTo(240,150,250,330);ctx.closePath();ctx.fill();
  ctx.fillStyle=c.shirt2;ctx.beginPath();ctx.moveTo(-60,128);ctx.lineTo(0,215);ctx.lineTo(60,128);ctx.closePath();ctx.fill();

    ctx.fillStyle='#2a1a10';ctx.beginPath();ctx.arc(ex+3+face*3,eyeY+2*(1-mood),7.5*blink+.5,0,7);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex+5+face*3,eyeY-1,2.4,0,7);ctx.fill();
    if(c.bags){ctx.strokeStyle='rgba(60,25,25,.35)';ctx.lineWidth=5;ctx.beginPath();ctx.arc(ex,eyeY+20,18,.2*Math.PI,.8*Math.PI);ctx.stroke()}
    ctx.strokeStyle=c.hair;ctx.lineWidth=9;ctx.lineCap='round';ctx.beginPath();const sd=1-mood;ctx.moveTo(ex+d*22,eyeY-30+sd*7-(mood>.6?3:0));ctx.lineTo(ex-d*20,eyeY-30-sd*11-(mood>.6?4:0));ctx.stroke();});
  // nose
  ctx.strokeStyle='rgba(90,45,25,.45)';ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-4,-8);ctx.quadraticCurveTo(-12,18,0,22);ctx.stroke();
  // mouth
  const my=52,open=talk*22;
  ctx.fillStyle='#5a1f1a';ctx.strokeStyle='#7a2f26';ctx.lineWidth=6;

  if(open>2){ctx.moveTo(-26,my);ctx.quadraticCurveTo(0,my+curve+open*0.6,26,my);ctx.quadraticCurveTo(0,my+open*1.8+curve*.3,-26,my);ctx.fill();
    ctx.fillStyle='#f5ece0';ctx.beginPath();ctx.moveTo(-18,my+2);ctx.quadraticCurveTo(0,my+1,18,my+2);ctx.lineTo(16,my+5);ctx.quadraticCurveTo(0,my+4,-16,my+5);ctx.fill()}
  else{ctx.moveTo(-24,my);ctx.quadraticCurveTo(0,my+curve+6,24,my);ctx.stroke()}
  ctx.restore();ctx.restore()}
function shade(hex,a){const n=parseInt(hex.slice(1),16);let r=(n>>16)+a,g=(n>>8&255)+a,b=(n&255)+a;r=clamp(r,0,255);g=clamp(g,0,255);b=clamp(b,0,255);return `rgb(${r|0},${g|0},${b|0})`}

  ctx.fillStyle='#ffd08a';ctx.beginPath();ctx.moveTo(820,640);ctx.lineTo(950,640);ctx.lineTo(925,560);ctx.lineTo(845,560);ctx.closePath();ctx.fill();
  glow(885,620,200,'rgba(255,190,100,.38)');

  ctx.fillStyle=vgrad(1080,1500,[[0,'#2c2540'],[1,'#17131f']]);rr(-40,1080,W+80,520,60);ctx.fill();
  ctx.fillStyle='#3a3254';rr(-40,1080,W+80,60,40);ctx.fill();

function bgDay(t){

  ctx.save();ctx.globalCompositeOperation='screen';for(let i=0;i<5;i++){const a=.04+.02*Math.sin(t*.6+i);ctx.fillStyle=`rgba(255,240,200,${a*3})`;ctx.beginPath();ctx.moveTo(120+i*40,0);ctx.lineTo(300+i*120,0);ctx.lineTo(760+i*140,1500);ctx.lineTo(500+i*70,1500);ctx.closePath();ctx.fill()}ctx.restore();
  glow(180,260,420,'rgba(255,248,215,.85)');

  for(let i=0;i<7;i++){const a=-1.1+i*.37;ctx.beginPath();ctx.moveTo(915,900);ctx.quadraticCurveTo(915+Math.sin(a)*120,780-Math.abs(i-3)*10+Math.sin(t+i)*5,915+Math.sin(a)*190,700+Math.abs(i-3)*30);ctx.stroke()}
  ctx.fillStyle='#d7a679';rr(-40,1150,W+80,500,60);ctx.fill();ctx.fillStyle='#e8bd8f';rr(-40,1150,W+80,50,40);ctx.fill()}
function bgLibrary(t){
  ctx.fillStyle=vgrad(0,H,[[0,'#1c1209'],[.5,'#2b1b0d'],[1,'#120a05']]);ctx.fillRect(0,0,W,H);
  const r=rnd(11);const cols=['#6b2a1f','#2f4a3a','#5a4320','#33283f','#7a5a2b','#4a2c25','#25394f','#8a6a35'];
  for(let row=0;row<5;row++){const y=240+row*270;ctx.fillStyle='#3b2713';ctx.fillRect(0,y+190,W,22);let x=-10+(row%2)*14;
    while(x<W){const w=34+r()*36,h=120+r()*70;ctx.fillStyle=cols[(r()*cols.length)|0];ctx.fillRect(x,y+190-h,w-4,h);ctx.fillStyle='rgba(255,220,150,.18)';ctx.fillRect(x+6,y+190-h+14,w-16,4);ctx.fillRect(x+6,y+190-h+h-22,w-16,3);x+=w}}
  const fl=.85+.15*Math.sin(t*9)+.05*Math.sin(t*23);glow(540,820,1000*fl*.9,'rgba(255,170,70,.34)');glow(300,1150,420*fl,'rgba(255,190,90,.35)');
  ctx.fillStyle='rgba(0,0,0,.28)';ctx.fillRect(0,0,W,H);
  // dust
  const rd=rnd(3);ctx.save();ctx.globalCompositeOperation='screen';for(let i=0;i<60;i++){const x=(rd()*W+Math.sin(t*.4+i)*30)%W,y=(rd()*H-t*14*(.3+rd())+H*3)%H;ctx.fillStyle=`rgba(255,220,150,${.2+.3*rd()})`;ctx.beginPath();ctx.arc(x,y,1+rd()*2.2,0,7);ctx.fill()}ctx.restore()}
function ibnSina(x,y,t){
  ctx.save();ctx.translate(x,y);
  // desk
  ctx.fillStyle='#3a2410';rr(-260,150,560,40,8);ctx.fill();ctx.fillStyle='#2a190b';ctx.fillRect(-240,190,40,70);ctx.fillRect(250,190,40,70);

  ctx.fillStyle='#e9d6a4';ctx.beginPath();ctx.moveTo(-120,150);ctx.lineTo(160,150);ctx.lineTo(190,110);ctx.lineTo(-90,110);ctx.closePath();ctx.fill();
  // body
  ctx.fillStyle='#5b3b22';ctx.beginPath();ctx.moveTo(-110,150);ctx.quadraticCurveTo(-120,-10,-40,-40);ctx.lineTo(70,-40);ctx.quadraticCurveTo(150,-10,140,150);ctx.closePath();ctx.fill();
  ctx.fillStyle='#8c6a43';ctx.beginPath();ctx.moveTo(-30,-40);ctx.lineTo(60,-40);ctx.lineTo(55,150);ctx.lineTo(-25,150);ctx.closePath();ctx.fill();
  // head + turban
  ctx.fillStyle='#b98962';ctx.beginPath();ctx.arc(15,-85,38,0,7);ctx.fill();
  ctx.fillStyle='#f0e8d6';ctx.beginPath();ctx.ellipse(15,-112,56,38,0,0,7);ctx.fill();ctx.strokeStyle='#cbbf9f';ctx.lineWidth=4;for(let i=-2;i<3;i++){ctx.beginPath();ctx.arc(15,-112,30+i*7,3.4,6.0);ctx.stroke()}
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.arc(15,-80,36,.2,Math.PI-.2);ctx.fill();
  // arm + pen
  const wob=Math.sin(t*5)*6;ctx.strokeStyle='#6b4727';ctx.lineWidth=26;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(95,10);ctx.lineTo(150+wob,95);ctx.stroke();
  ctx.strokeStyle='#e8e0c8';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(150+wob,95);ctx.lineTo(178+wob,126);ctx.stroke();

  ctx.fillStyle='#f2e6c4';ctx.fillRect(-215,60,26,90);const fl=Math.sin(t*12)*3;ctx.fillStyle='#ffb347';ctx.beginPath();ctx.ellipse(-202+fl*.4,48,9,20+fl,0,0,7);ctx.fill();ctx.fillStyle='#fff3c0';ctx.beginPath();ctx.ellipse(-202+fl*.4,52,4,11,0,0,7);ctx.fill();

function crocus(x,y,s,t,grow){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  ctx.strokeStyle='#4f7a43';ctx.lineWidth=8;ctx.lineCap='round';[-1,1].forEach(d=>{ctx.beginPath();ctx.moveTo(0,150);ctx.quadraticCurveTo(d*40,60,d*90,-10);ctx.stroke()});
  ctx.lineWidth=10;ctx.beginPath();ctx.moveTo(0,160);ctx.lineTo(0,40);ctx.stroke();
  const open=ease(grow);
  for(let i=0;i<6;i++){const a=-Math.PI/2+(i-2.5)*.42*open,g=ctx.createLinearGradient(0,40,0,-110);g.addColorStop(0,'#5d3a8a');g.addColorStop(1,'#a58ad6');ctx.save();ctx.translate(0,40);ctx.rotate(a+Math.PI/2);ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(0,-70*open-10,30,80*open,0,0,7);ctx.fill();ctx.restore()}

function parchment(x,y,w,h,a){

  const g=ctx.createLinearGradient(x,y,x+w,y+h);g.addColorStop(0,'#ead7a6');g.addColorStop(.5,'#f1e2b8');g.addColorStop(1,'#d9c18a');ctx.fillStyle=g;rr(x,y,w,h,26);ctx.fill();ctx.shadowBlur=0;
  ctx.strokeStyle='rgba(120,80,30,.55)';ctx.lineWidth=4;rr(x+16,y+16,w-32,h-32,18);ctx.stroke();ctx.restore()}
function bgLab(t){
  ctx.fillStyle=vgrad(0,H,[[0,'#06141c'],[.5,'#0a2a35'],[1,'#051017']]);ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(120,220,230,.07)';ctx.lineWidth=2;for(let i=0;i<W;i+=90){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,H);ctx.stroke()}for(let j=0;j<H;j+=90){ctx.beginPath();ctx.moveTo(0,j);ctx.lineTo(W,j);ctx.stroke()}

  glow(540,820,620,'rgba(217,178,97,.13)')}
function molecule(cx,cy,t,a){
  // crocetin-like polyene chain with end rings, rotating around Y
  const pts=[];const N=11;for(let i=0;i<N;i++)pts.push([(i-5)*62,(i%2?-34:34),0]);
  const bonds=[];for(let i=0;i<N-1;i++)bonds.push([i,i+1,i%2?1:2]);
  // methyl branches
  [[2,0,-1],[4,0,1],[6,0,-1],[8,0,1]].forEach(([i,_,s])=>{const p=pts[i];pts.push([p[0],p[1]+s*56,s*20]);bonds.push([i,pts.length-1,1])});
  // end rings (hexagons)
  [-1,1].forEach(side=>{const base=pts[side<0?0:N-1];const start=pts.length;for(let k=0;k<6;k++){const ang=k*Math.PI/3;pts.push([base[0]+side*(48+Math.cos(ang)*46),base[1]+Math.sin(ang)*46,Math.sin(ang*2)*10])}
    bonds.push([side<0?0:N-1,start,1]);for(let k=0;k<6;k++)bonds.push([start+k,start+(k+1)%6,k%2?1:2])});
  const ay=Math.sin(t*.7)*1.0,ca=Math.cos(ay),sa=Math.sin(ay),ax=.35,cx2=Math.cos(ax),sx=Math.sin(ax);
  const P=pts.map(p=>{let x=p[0]*ca+p[2]*sa,z=-p[0]*sa+p[2]*ca,y=p[1];const y2=y*cx2-z*sx,z2=y*sx+z*cx2;const f=900/(900+z2);return[cx+x*f*1.05,cy+y2*f*1.2,f,z2]});
  ctx.save();ctx.globalAlpha=a;ctx.globalCompositeOperation='screen';ctx.lineCap='round';
  bonds.forEach(([i,j,o])=>{const A=P[i],B=P[j];ctx.strokeStyle='rgba(120,230,240,.55)';ctx.lineWidth=(o===2?10:6)*(A[2]+B[2])/2;ctx.beginPath();ctx.moveTo(A[0],A[1]);ctx.lineTo(B[0],B[1]);ctx.stroke();
    if(o===2){ctx.strokeStyle='rgba(2,20,28,.9)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(A[0],A[1]);ctx.lineTo(B[0],B[1]);ctx.stroke()}});
  P.forEach((p,i)=>{const r=(i<11?13:9)*p[2];glow(p[0],p[1],r*3.4,i<11?'rgba(255,200,110,.55)':'rgba(120,230,240,.35)');ctx.fillStyle=i<11?'#ffd88c':'#8fe9f2';ctx.beginPath();ctx.arc(p[0],p[1],r,0,7);ctx.fill()});

function petri(x,y,t,a){

function glass(x,y,s,fill,t){
