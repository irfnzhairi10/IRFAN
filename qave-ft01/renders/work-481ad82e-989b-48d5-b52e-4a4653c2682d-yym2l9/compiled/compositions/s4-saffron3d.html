<template>
  <!-- S4 · 12.10–18.00s (local 0–5.9) · TRUE 3D (Three.js r149, driven by the paused GSAP timeline)
       VO: "barang yang akan dijual ini barang saffron, barang rare, saffron super negin" -->
  <style>
    @font-face { font-family: "Cinzel"; src: url("assets/fonts/cinzel-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
    @font-face { font-family: "Manrope"; src: url("assets/fonts/manrope-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
    @font-face { font-family: "Cormorant Garamond"; src: url("assets/fonts/cormorant-garamond-latin-500-italic.woff2") format("woff2"); font-weight: 500; font-style: italic; }
    #root { position: absolute; inset: 0; overflow: hidden; }
    #root .gold {
      background: linear-gradient(100deg, #8a6a32 0%, #d9b46f 28%, #f6e1a6 42%, #c9a05a 58%, #7d5d2a 100%);
      background-size: 240% 100%; background-position: 100% 0;
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    #s4-gl { position: absolute; left: 0; top: 650px; width: 1080px; height: 1100px; }
    #s4-fact { position: absolute; left: 0; right: 0; top: 250px; text-align: center; }
    #s4-fact .n { font-family: "Cinzel", serif; font-weight: 700; font-size: 200px; line-height: 1; color: #d8431e; }
    #s4-fact .l { font-family: "Manrope", sans-serif; font-weight: 700; font-size: 54px; letter-spacing: 0.14em; color: #e9cf8e; margin-top: 10px; }
    #s4-fact .s { font-family: "Cormorant Garamond", serif; font-style: italic; font-weight: 500; font-size: 58px; color: #cdb27a; margin-top: 8px; }
    #s4-titlebox { position: absolute; left: 0; right: 0; top: 240px; height: 200px; overflow: hidden; }
    .s4-title {
      position: absolute; left: 0; right: 0; top: 0; text-align: center;
      font-family: "Cinzel", serif; font-weight: 700; font-size: 168px; line-height: 200px; letter-spacing: 0.02em; white-space: nowrap;
    }
    #s4-sub { position: absolute; left: 0; right: 0; top: 460px; text-align: center; }
    #s4-sub .k { font-family: "Manrope", sans-serif; font-weight: 700; font-size: 44px; letter-spacing: 0.24em; color: #e9cf8e; }
    #s4-sub .g { font-family: "Cormorant Garamond", serif; font-style: italic; font-weight: 500; font-size: 62px; color: #f0d79a; margin-top: 6px; }
  </style>
  <div id="root" data-composition-id="s4" data-width="1080" data-height="1920">
    <canvas id="s4-gl" width="1080" height="1100"></canvas>
    <div id="s4-fact">
      <div class="n">3</div>
      <div class="l">HELAI SEKUNTUM BUNGA</div>
      <div class="s">dipetik dengan tangan</div>
    </div>
    <div id="s4-titlebox" data-layout-allow-overflow>
      <div id="s4-t1" class="s4-title gold">SAFFRON</div>
      <div id="s4-t2" class="s4-title gold" style="font-size: 124px">SUPER NEGIN</div>
    </div>
    <div id="s4-sub">
      <div class="k">PREMIUM IRANIAN SAFFRON</div>
      <div class="g">gred tertinggi saffron Iran</div>
    </div>
  </div>
  <script>
    (function () {
      const D = 5.9;
      const canvas = document.getElementById("s4-gl");
      const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(1080, 1100, false);
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 0.9;
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(32, 1080 / 1100, 0.05, 50);

      // light: warm key upper-left, cool rim from behind, soft fill
      const key = new THREE.DirectionalLight(0xffd6a8, 2.3); key.position.set(-2, 3, 3); scene.add(key);
      const rim = new THREE.DirectionalLight(0x9fbcff, 2.2); rim.position.set(1.5, 1.5, -3); scene.add(rim);
      scene.add(new THREE.HemisphereLight(0x3a2a1a, 0x050403, 0.9));

      // one saffron stigma: thin thread flaring into a frilled trumpet (Lathe + deterministic frill)
      function stigmaGeometry(seed) {
        const pts = [];
        const prof = [[0.0, 0.010], [0.25, 0.012], [0.5, 0.014], [0.7, 0.018], [0.8, 0.026], [0.88, 0.040], [0.94, 0.058], [0.985, 0.072], [1.0, 0.070], [0.99, 0.055]];
        prof.forEach(([y, r]) => pts.push(new THREE.Vector2(r, y * 1.6)));
        const g = new THREE.LatheGeometry(pts, 64);
        const p = g.attributes.position;
        for (let i = 0; i < p.count; i++) {
          let x = p.getX(i), y = p.getY(i), z = p.getZ(i);
          const a = Math.atan2(z, x), h = y / 1.6;
          if (h > 0.85) { const k = 1 + 0.16 * ((h - 0.85) / 0.15) * Math.sin(9 * a + seed); x *= k; z *= k; }
          x += 0.07 * h * h; // gentle curve
          p.setXYZ(i, x, y, z);
        }
        g.computeVertexNormals();
        return g;
      }
      const mat = new THREE.MeshStandardMaterial({ color: new THREE.Color(0xa3180c).convertSRGBToLinear(), roughness: 0.6, metalness: 0.0, emissive: 0x1a0300, side: THREE.DoubleSide });
      const group = new THREE.Group(); scene.add(group);
      const threads = [0, 1, 2].map((i) => { const m = new THREE.Mesh(stigmaGeometry(i * 1.7), mat); group.add(m); return m; });
      const baseTilt = [0.12, 0.0, -0.12], fanTilt = [0.42, 0.02, -0.40], yaw = [0.0, 2.1, 4.2];
      // thin gold ring in 3D space behind the threads (the brand's circle)
      const ring = new THREE.Mesh(new THREE.TorusGeometry(0.92, 0.009, 16, 200),
        new THREE.MeshStandardMaterial({ color: 0xd4af6a, metalness: 0.55, roughness: 0.38, emissive: 0x4a3512 }));
      ring.position.set(0, 0.85, -0.6); scene.add(ring);

      const ease = (x) => (x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2);
      const clamp = (x) => Math.min(1, Math.max(0, x));
      function renderAt(t) {
        const rise = 1 - Math.pow(1 - clamp(t / 0.9), 4);              // expo-ish arrival
        const fan = ease(clamp((t - 4.6) / 0.45));                        // fan out on "SUPER NEGIN"
        const dive = Math.pow(clamp((t - 5.45) / 0.45), 3);               // exit dive (accelerates)
        group.position.y = -1.6 + 1.6 * rise;
        group.rotation.y = 0.35 + t * 0.42;                               // constant turn (linear on purpose)
        threads.forEach((m, i) => {
          m.rotation.set(0, yaw[i] * (1 - fan) + 0 * fan, baseTilt[i] + (fanTilt[i] - baseTilt[i]) * fan);
        });
        ring.rotation.y = 0.25 * Math.sin(t * 0.5);
        ring.scale.setScalar(0.6 + 0.4 * rise);
        const camZ = 4.2 - 1.0 * ease(clamp(t / 4.6)) - 2.6 * dive;
        camera.position.set(0.0, 0.95 + 0.35 * dive, camZ);
        camera.lookAt(0, 0.9 + 0.5 * dive, 0);
        renderer.render(scene, camera);
      }
      renderAt(0);

      const tl = gsap.timeline({ paused: true });
      const clock = { t: 0 };
      tl.fromTo(clock, { t: 0 }, { t: D, duration: D, ease: "none", onUpdate: () => renderAt(clock.t) }, 0);

      gsap.set("#s4-fact", { opacity: 0, filter: "blur(8px)" });
      gsap.set("#s4-t1", { yPercent: 110 });
      gsap.set("#s4-t2", { yPercent: 110 });
      gsap.set("#s4-sub", { opacity: 0 });
      // fact card: 3 threads per flower (0.3 -> 2.1)
      tl.to("#s4-fact", { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, 0.35);
      tl.to("#s4-fact", { opacity: 0, filter: "blur(8px)", duration: 0.16, ease: "power2.in" }, 2.15);
      // SAFFRON rises in its window on "saffron" (14.46 -> 2.36)
      tl.to("#s4-t1", { yPercent: 0, duration: 0.4, ease: "expo.out" }, 2.32);
      tl.to("#s4-t1", { backgroundPosition: "0% 0", duration: 0.7, ease: "power2.inOut" }, 2.6);
      // slot roll SAFFRON -> SUPER NEGIN on "super" (16.79 -> 4.69)
      tl.to("#s4-t1", { yPercent: -110, duration: 0.24, ease: "power3.in" }, 4.55);
      tl.to("#s4-t2", { yPercent: 0, duration: 0.36, ease: "expo.out" }, 4.68);
      tl.to("#s4-t2", { backgroundPosition: "0% 0", duration: 0.6, ease: "power2.inOut" }, 4.9);
      tl.to("#s4-sub", { opacity: 1, duration: 0.25 }, 3.5);
      // exit with the dive
      tl.to("#s4-titlebox, #s4-sub", { opacity: 0, filter: "blur(10px)", duration: 0.2, ease: "power2.in" }, 5.62);
      tl.to("#s4-gl", { opacity: 0, duration: 0.12 }, 5.76);
      window.__timelines["s4"] = tl;
    })();
  </script>
</template>
