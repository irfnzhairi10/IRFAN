<!doctype html>
<html
  lang="ms"
  data-composition-variables='[
    {"id":"brandGold","type":"color","label":"Emas jenama","default":"#D4AF6A"},
    {"id":"saffronRed","type":"color","label":"Merah saffron","default":"#D8431E"},
    {"id":"paper","type":"color","label":"Latar kertas hitam","default":"#0B0A08"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>QAVE — VGC-FT01 Motion Ad (v1 · animation only, preserved)</title>
    <!-- Local libraries only: no network during render -->
    <script src="assets/lib/gsap.min.js"></script>
    <script src="assets/lib/three.min.js"></script>
    <style>
      @font-face { font-family: "Cinzel"; src: url("assets/fonts/cinzel-latin-600-normal.woff2") format("woff2"); font-weight: 600; }
      @font-face { font-family: "Cinzel"; src: url("assets/fonts/cinzel-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
      @font-face { font-family: "Cormorant Garamond"; src: url("assets/fonts/cormorant-garamond-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
      @font-face { font-family: "Cormorant Garamond"; src: url("assets/fonts/cormorant-garamond-latin-500-italic.woff2") format("woff2"); font-weight: 500; font-style: italic; }
      @font-face { font-family: "Manrope"; src: url("assets/fonts/manrope-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
      @font-face { font-family: "Manrope"; src: url("assets/fonts/manrope-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0a08; }
      #paper {
        position: absolute; inset: 0; z-index: 0;
        background:
          radial-gradient(120% 70% at 50% 38%, #17130d 0%, #0b0a08 60%, #070605 100%);
      }
      #grain {
        position: absolute; inset: 0; z-index: 50; pointer-events: none;
        background-image: url("assets/img/grain.png"); background-size: 512px 512px;
        opacity: 0.07; mix-blend-mode: overlay;
      }
      .scene { position: absolute; inset: 0; z-index: 10; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="43"
      data-width="1080"
      data-height="1920"
      data-fps="30"
    >
      <!-- Ground: black foil-stamping card (from the brand mark's own medium) -->
      <div id="paper" data-layout-ignore></div>

      <!-- Scenes (one sub-composition each). Times = VO word cues, see audio-src/cues.json -->
      <div id="s1" class="scene" data-composition-id="s1" data-composition-src="compositions/s1-hook.html"
        data-start="0" data-duration="4.1" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="s2" class="scene" data-composition-id="s2" data-composition-src="compositions/s2-rasmi.html"
        data-start="4.1" data-duration="4" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="s3" class="scene" data-composition-id="s3" data-composition-src="compositions/s3-tarikh.html"
        data-start="8.1" data-duration="4" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="s4" class="scene" data-composition-id="s4" data-composition-src="compositions/s4-saffron3d.html"
        data-start="12.1" data-duration="5.9" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="s5" class="scene" data-composition-id="s5" data-composition-src="compositions/v1/s5-hadiah.html"
        data-start="18" data-duration="8" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="s6" class="scene" data-composition-id="s6" data-composition-src="compositions/v1/s6-nilai.html"
        data-start="26" data-duration="11" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="s7" class="scene" data-composition-id="s7" data-composition-src="compositions/s7-staytuned.html"
        data-start="37" data-duration="2.2" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="s8" class="scene" data-composition-id="s8" data-composition-src="compositions/s8-outro.html"
        data-start="39.2" data-duration="3.8" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>

      <!-- Paper grain over everything (static texture, 7%) -->
      <div id="grain" data-layout-ignore></div>

      <!-- Audio: VO from the supplied recording (cleaned + loudness-normalised copy), procedural music + SFX -->
      <audio id="vo" class="clip" src="assets/audio/vo-clean.wav" data-start="0" data-duration="39.05" data-track-index="5" data-volume="1"></audio>
      <audio id="music" class="clip" src="assets/audio/music-bed.wav" data-start="0" data-duration="43" data-track-index="6" data-volume="0.42"></audio>
      <audio id="sfx" class="clip" src="assets/audio/sfx.wav" data-start="0" data-duration="43" data-track-index="7" data-volume="0.6"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
