<!doctype html>
<meta charset="utf-8">
<title>Saffron Reel</title>
<style>
@font-face{font-family:'Oswald';src:url('fonts/Oswald.ttf');font-weight:200 700}
html,body{margin:0;background:#000}
canvas{display:block;width:100vw;max-width:calc(100vh*9/16);margin:0 auto;height:auto;aspect-ratio:9/16}
</style>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="timeline.js"></script>
<script>
const W=1080,H=1920,CX=540,C=document.getElementById('c'),ctx=C.getContext('2d');
const TL=window.TL;
const GOLD='#ffb020',EMBER='#ff4b2b',VIOLET='#8a5cd6',CREAM='#f4ecd8',NIGHT='#070b1c';
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>1-Math.pow(1-clamp(x),3);
const back=x=>{x=clamp(x);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const sr=i=>{const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s)};
const lerp=(a,b,k)=>a+(b-a)*k;
function T(s,x,y,size,col,o={}){const{a=1,w=600,al='center',ls=0,stroke=null,sc=1,rot=0,font='Oswald'}=o;
  ctx.save();ctx.globalAlpha*=a;ctx.translate(x,y);ctx.rotate(rot);ctx.scale(sc,sc);
  ctx.font=`${w} ${size}px ${font},'DejaVu Sans',sans-serif`;ctx.textAlign=al;ctx.textBaseline='middle';ctx.letterSpacing=ls+'px';
  if(stroke){ctx.lineWidth=stroke.w;ctx.strokeStyle=stroke.c;ctx.lineJoin='round';ctx.strokeText(s,0,0)}
  ctx.fillStyle=col;ctx.fillText(s,0,0);ctx.restore()}
function grad(c1,c2,y0=0,y1=H){const g=ctx.createLinearGradient(0,y0,0,y1);g.addColorStop(0,c1);g.addColorStop(1,c2);ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
function glow(x,y,r,col,a=1){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');ctx.save();ctx.globalAlpha*=a;ctx.fillStyle=g;ctx.fillRect(x-r,y-r,2*r,2*r);ctx.restore()}
function stars(t,n,seed,ymax){for(let i=0;i<n;i++){const x=sr(i+seed)*W,y=sr(i*3+seed)*ymax,r=0.8+sr(i*7+seed)*2;ctx.globalAlpha=0.3+0.7*Math.abs(Math.sin(t*(0.8+sr(i)*1.6)+i));ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()}ctx.globalAlpha=1}
function dust(t,n,col,seed,sp=40){ctx.save();ctx.fillStyle=col;for(let i=0;i<n;i++){const x=(sr(i+seed)*W+Math.sin(t*0.6+i)*30+W)%W,y=((sr(i*5+seed)*H-t*sp*(0.4+sr(i*2)))%H+H)%H;ctx.globalAlpha=0.15+0.5*Math.abs(Math.sin(t*1.3+i));ctx.beginPath();ctx.arc(x,y,1.5+sr(i*9)*3,0,7);ctx.fill()}ctx.restore()}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function moon(x,y,r,a=1){ctx.save();ctx.globalAlpha*=a;glow(x,y,r*2.4,'rgba(255,233,168,0.45)');ctx.beginPath();ctx.arc(x+r*0.5,y-r*0.15,r*0.86,0,7);ctx.rect(0,0,W,H);ctx.clip('evenodd');ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fillStyle='#ffe9a8';ctx.fill();ctx.restore()}
function petal(){ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(-34,-20,-40,-120,0,-170);ctx.bezierCurveTo(40,-120,34,-20,0,0)}
function crocus(x,y,s,grow,open,sway,t=0){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  const hx=sway*grow,hy=-230*grow;
  ctx.strokeStyle='#2f8f5b';ctx.lineWidth=11;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(sway*0.2*grow,hy*0.5,hx,hy);ctx.stroke();
  ctx.fillStyle='#3aa66c';for(const k of[-1,1]){ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(k*50*grow,-70*grow,k*34*grow,-150*grow);ctx.quadraticCurveTo(k*18*grow,-70*grow,0,0);ctx.fill()}
  if(open>0){ctx.translate(hx,hy);
    for(let pass=0;pass<2;pass++)for(let i=0;i<3;i++){const a=(i-1)*0.55*open*(pass?1:1.5)+(pass?0:0.0);ctx.save();ctx.rotate(a);ctx.scale(0.9*(0.5+0.5*open),0.9*(0.3+0.7*open));
      const g=ctx.createLinearGradient(0,0,0,-170);g.addColorStop(0,pass?'#9c6be8':'#5b3a9e');g.addColorStop(1,pass?'#cdb0ff':'#8a5cd6');ctx.fillStyle=g;petal();ctx.fill();ctx.restore()}
    glow(0,-22,70*open,'rgba(255,120,60,0.55)');
    ctx.lineCap='round';ctx.lineWidth=9;ctx.strokeStyle=EMBER;
    for(let i=0;i<3;i++){const dx=(i-1)*30,w=Math.sin(t*2+i)*4*open;ctx.beginPath();ctx.moveTo(0,-8);ctx.quadraticCurveTo(dx*0.4+w,-60*open,dx*1.2,-110*open);ctx.stroke();ctx.fillStyle='#ff7a3d';ctx.beginPath();ctx.arc(dx*1.2,-110*open,7,0,7);ctx.fill()}
  }
  ctx.restore()}
function mini(x,y,r,k){ctx.save();ctx.translate(x,y);ctx.scale(k,k);ctx.fillStyle=VIOLET;for(let i=0;i<3;i++){ctx.save();ctx.rotate(i*2.09);ctx.beginPath();ctx.ellipse(0,-r*0.5,r*0.34,r*0.62,0,0,7);ctx.fill();ctx.restore()}ctx.fillStyle=EMBER;ctx.beginPath();ctx.arc(0,0,r*0.2,0,7);ctx.fill();ctx.restore()}
function capsule(x,y,w,h,rot,col){ctx.save();ctx.translate(x,y);ctx.rotate(rot);rr(-w/2,-h/2,w,h,h/2);ctx.fillStyle=col;ctx.fill();ctx.restore()}

/* ---------- SCENES: each draws with local time t ---------- */
const S=[];
// 1 HOOK
S[0]=t=>{
  grad('#05081a','#1b2352');stars(t,70,3,900);moon(900,200,95,ease(t*2));
  glow(CX,1000,600,'rgba(255,60,40,0.18)');
  // phase 1: clock
  const p1=1-seg(t,1.7,2.2);
  if(t<2.3){const sh=t>0.15&&t<0.5?Math.sin(t*90)*10*(0.5-t):0;
    ctx.save();ctx.globalAlpha=p1;ctx.translate(sh,0);
    T('JAM 3 PAGI.',CX,470,150,'#fff',{w:700,sc:back(seg(t,0.05,0.45)),stroke:{w:10,c:'#000'}});
    rr(110,600,860,520,60);ctx.fillStyle='#16060b';ctx.fill();ctx.lineWidth=8;ctx.strokeStyle=EMBER;ctx.stroke();
    glow(CX,860,520,'rgba(255,40,40,0.35)',0.7+0.3*Math.sin(t*10));
    T('3:00',CX,860,420,EMBER,{w:700,sc:back(seg(t,0.12,0.5)),ls:6});
    T('PAGI',CX,1030,60,'#ff9a85',{ls:14});ctx.restore()}
  // phase 2: eyes
  if(t>1.7&&t<3.7){const a=ease(seg(t,1.7,2.1))*(1-seg(t,3.4,3.7));ctx.save();ctx.globalAlpha=a;
    const open=0.35+0.65*back(seg(t,2.0,2.5));const jit=Math.sin(t*40)*2;
    for(const k of[-1,1])eye(CX+k*215+jit,860,190,125,open,Math.sin(t*3)*14,t);
    T('MATA MASIH TERBUKA',CX,1160,100,'#fff',{w:700,sc:back(seg(t,2.1,2.5)),stroke:{w:9,c:'#000'}});ctx.restore()}
  // phase 3: thoughts
  if(t>3.4){const a=ease(seg(t,3.4,3.8));ctx.save();ctx.globalAlpha=a;head(CX,980,1.5);
    ctx.lineCap='round';
    for(let j=0;j<3;j++){ctx.strokeStyle=['#ff6a3d','#ffb020','#ff4b2b'][j];ctx.lineWidth=7-j;ctx.beginPath();
      for(let k=0;k<=160;k++){const th=k*0.14+t*(2.2+j*0.6)+j*2,rad=30+k*(2.2+j*0.3);const px=CX+Math.cos(th)*rad,py=560+Math.sin(th)*rad*0.8;k?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.stroke()}
    const sy=['?','!','?','...','!'];for(let i=0;i<5;i++){const th=t*1.4+i*1.26;T(sy[i],CX+Math.cos(th)*330,560+Math.sin(th)*260,110,GOLD,{w:700,a:0.9})}
    T('FIKIRAN TAK BERHENTI',CX,1260,92,'#fff',{w:700,sc:back(seg(t,3.6,4.0)),stroke:{w:9,c:'#000'},rot:Math.sin(t*30)*0.01});ctx.restore()}
};
function eye(x,y,w,h,open,look,t){ctx.save();ctx.translate(x,y);
  ctx.beginPath();ctx.ellipse(0,0,w,h*open+4,0,0,7);ctx.fillStyle='#fff';ctx.fill();ctx.clip();
  ctx.strokeStyle='rgba(220,40,50,0.7)';ctx.lineWidth=3;for(let i=0;i<9;i++){const a=Math.PI*(i/9)+(i%2?Math.PI:0);ctx.beginPath();ctx.moveTo(Math.cos(a)*w,Math.sin(a)*h*0.6);ctx.quadraticCurveTo(Math.cos(a)*w*0.7,Math.sin(a)*h*0.2,Math.cos(a)*w*0.55,Math.sin(a)*h*0.15);ctx.stroke()}
  ctx.fillStyle='#8a5a2b';ctx.beginPath();ctx.arc(look,0,h*0.78,0,7);ctx.fill();ctx.fillStyle='#1a0e08';ctx.beginPath();ctx.arc(look,0,h*0.38,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(look+h*0.22,-h*0.22,h*0.14,0,7);ctx.fill();ctx.restore();
  ctx.save();ctx.translate(x,y);ctx.strokeStyle='#14101e';ctx.lineWidth=10;ctx.beginPath();ctx.ellipse(0,0,w,h*open+4,0,Math.PI,Math.PI*2);ctx.stroke();ctx.restore()}
function head(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle='#e9b48f';ctx.beginPath();ctx.ellipse(0,0,120,140,0,0,7);ctx.fill();
  ctx.fillStyle='#14101e';ctx.beginPath();ctx.moveTo(-124,-20);ctx.bezierCurveTo(-130,-170,130,-170,124,-20);ctx.bezierCurveTo(100,-90,40,-80,0,-100);ctx.bezierCurveTo(-50,-80,-100,-90,-124,-20);ctx.fill();
  ctx.fillStyle='#fff';for(const k of[-1,1]){ctx.beginPath();ctx.ellipse(k*45,10,22,26,0,0,7);ctx.fill();ctx.fillStyle='#2a1a12';ctx.beginPath();ctx.arc(k*45+4,12,11,0,7);ctx.fill();ctx.fillStyle='#fff'}
  ctx.strokeStyle='#7a3b2e';ctx.lineWidth=6;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-20,80);ctx.lineTo(20,80);ctx.stroke();ctx.restore()}

// 2 REVEAL
S[1]=t=>{
  grad('#2b1a5e','#ff7a45',0,1500);ctx.fillStyle='#ffc062';
  const sunY=lerp(1500,1000,ease(t/4));glow(CX,sunY,700,'rgba(255,200,90,0.8)');ctx.fillStyle='#ffd27a';ctx.beginPath();ctx.arc(CX,sunY,150,0,7);ctx.fill();
  ctx.fillStyle='#3a2260';ctx.beginPath();ctx.moveTo(0,1180);for(let x=0;x<=W;x+=60)ctx.lineTo(x,1100-Math.abs(Math.sin(x*0.011+1))*150);ctx.lineTo(W,1180);ctx.fill();
  ctx.fillStyle='#1d0f3d';ctx.fillRect(0,1180,W,H-1180);
  for(let r=0;r<5;r++)for(let c=0;c<9;c++){const y=1230+r*95,x=(c+(r%2)*0.5)*135+20;crocus(x,y,0.22+r*0.06,1,0.9,Math.sin(t*1.5+c+r)*10,t)}
  crocus(CX,1560,1.6,ease(seg(t,0.2,1.8)),ease(seg(t,1.4,3.2)),Math.sin(t*1.2)*14,t);
  dust(t,40,'#ffd27a',5,-30);
  const w='SAFFRON';for(let i=0;i<w.length;i++){const k=back(seg(t,3.3+i*0.07,3.65+i*0.07));T(w[i],CX+(i-3)*118,520,230,GOLD,{w:700,sc:k,a:clamp(k),stroke:{w:12,c:'rgba(40,10,50,0.9)'}})}
  T('CROCUS SATIVUS',CX,660,56,CREAM,{a:ease(seg(t,4,4.5)),ls:12,w:500});
  T('SEBUAH RAHSIA MERAH',CX,300,64,'#fff',{a:ease(seg(t,0.3,0.8)),ls:10,w:500,stroke:{w:6,c:'#000'}});
};
// 3 INFOGRAPHIC flower -> 150
S[2]=t=>{
  grad('#0a0f2c','#1c1550');ctx.strokeStyle='rgba(255,255,255,0.05)';ctx.lineWidth=2;for(let x=0;x<=W;x+=60){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<=H;y+=60){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
  dust(t,30,'#ffd27a',8,-25);
  const A=1-seg(t,3.2,3.7),B=seg(t,3.4,3.9);
  if(A>0){ctx.save();ctx.globalAlpha=A;
    T('3 HELAI',CX,260,170,GOLD,{w:700,sc:back(seg(t,0.2,0.6)),stroke:{w:10,c:'#000'}});T('BENANG MERAH',CX,400,110,'#fff',{w:700,a:ease(seg(t,0.5,0.9))});
    crocus(CX,1400,1.8,1,1,0,t);
    const lab=[[-300,700,'1'],[0,620,'2'],[300,700,'3']];lab.forEach(([dx,ly,n],i)=>{const k=back(seg(t,1.0+i*0.35,1.4+i*0.35));ctx.save();ctx.globalAlpha*=clamp(k);ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.setLineDash([8,8]);ctx.beginPath();ctx.moveTo(CX+(i-1)*70,775);ctx.lineTo(CX+dx,ly+50);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle=EMBER;ctx.beginPath();ctx.arc(CX+dx,ly,50*k,0,7);ctx.fill();T(n,CX+dx,ly,64,'#fff',{w:700});ctx.restore()});
    ctx.restore()}
  if(B>0){ctx.save();ctx.globalAlpha=B;
    T('LEBIH',CX,250,100,'#fff',{w:600,ls:10});T('150 BUNGA',CX,390,200,GOLD,{w:700,sc:back(seg(t,3.6,4.1)),stroke:{w:10,c:'#000'}});
    const n=Math.floor(150*ease(seg(t,4.0,7.6)));for(let i=0;i<150;i++){if(i>=n)break;const c=i%15,r=Math.floor(i/15);const k=back(seg(t,4.0+i/150*3.6,4.0+i/150*3.6+0.3));mini(95+c*62,590+r*62,28,k)}
    T(String(n)+'+',CX,1210,240,'#fff',{w:700,stroke:{w:10,c:'#000'}});T('BUNGA = 1 GRAM',CX,1345,84,GOLD,{w:700,ls:4});
    const pk=seg(t,7.8,8.4);if(pk>0){ctx.save();ctx.translate(CX,1470);ctx.rotate(-0.05);ctx.globalAlpha*=ease(pk);rr(-330,-48,660,96,18);ctx.fillStyle=EMBER;ctx.fill();T('DIPETIK DENGAN TANGAN',0,0,64,'#fff',{w:700,ls:4,sc:back(pk)});ctx.restore()}
    ctx.restore()}
};
// 4 HISTORY
S[3]=t=>{
  grad('#1a1030','#3a2312');
  for(let r=0;r<6;r++){ctx.fillStyle='#2a1708';ctx.fillRect(0,260+r*170,W,16);for(let b=0;b<22;b++){const x=b*52+sr(b+r*30)*10,h=90+sr(b*3+r)*50;ctx.fillStyle=['#7a2f2f','#a8742a','#3a5a7a','#5a3a7a','#2f6a4a','#c9a24a'][Math.floor(sr(b*7+r*3)*6)];ctx.fillRect(x,260+r*170-h,40,h)}}
  glow(210,420,520,'rgba(255,190,90,0.55)',0.8+0.2*Math.sin(t*3));
  // scholar
  ctx.save();ctx.translate(300,1100);ctx.fillStyle='#6a1e2c';ctx.beginPath();ctx.moveTo(-170,330);ctx.quadraticCurveTo(-160,40,0,20);ctx.quadraticCurveTo(160,40,170,330);ctx.fill();
  ctx.fillStyle='#e0a982';ctx.beginPath();ctx.arc(0,-60,72,0,7);ctx.fill();ctx.fillStyle='#2a1a12';ctx.beginPath();ctx.moveTo(-62,-40);ctx.quadraticCurveTo(0,110,62,-40);ctx.quadraticCurveTo(0,10,-62,-40);ctx.fill();
  ctx.fillStyle=CREAM;ctx.beginPath();ctx.ellipse(0,-120,92,46,0,0,7);ctx.fill();ctx.beginPath();ctx.ellipse(0,-105,98,24,0,0,7);ctx.fillStyle='#e7d9b4';ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-24,-62,7,0,7);ctx.arc(24,-62,7,0,7);ctx.fill();
  const qx=140+Math.sin(t*5)*26,qy=250+Math.cos(t*7)*8;ctx.strokeStyle='#6a1e2c';ctx.lineWidth=40;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(100,120);ctx.lineTo(qx,qy);ctx.stroke();
  ctx.strokeStyle='#f4ecd8';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(qx,qy);ctx.lineTo(qx+60,qy-120);ctx.stroke();ctx.restore();
  ctx.fillStyle='#5a3418';ctx.fillRect(40,1420,560,40);ctx.fillStyle=CREAM;ctx.fillRect(110,1380,380,40);
  // book with arabic title
  const bk=back(seg(t,0.4,1.0));ctx.save();ctx.translate(760,1020);ctx.scale(bk,bk);ctx.rotate(-0.05);rr(-250,-190,500,380,18);ctx.fillStyle='#e8d6a8';ctx.fill();ctx.lineWidth=10;ctx.strokeStyle='#8a5a1e';ctx.stroke();
  ctx.strokeStyle='#a8742a';ctx.lineWidth=4;rr(-220,-160,440,320,10);ctx.stroke();
  T('القانون في الطب',0,-40,54,'#4a2a10',{w:700,font:'DejaVu Sans'});T('AL-QANUN FI AL-TIBB',0,60,46,'#4a2a10',{w:600,ls:3});T('IBN SINA',0,115,38,'#8a5a1e',{w:500,ls:8});ctx.restore();
  T('KITAB PERUBATAN KLASIK',CX,210,64,'#fff',{a:ease(seg(t,0.3,0.8)),w:600,ls:6,stroke:{w:7,c:'#000'}});
  const pn=seg(t,4.3,4.9);if(pn>0){ctx.save();ctx.globalAlpha=ease(pn);rr(60,1250,960,300,36);ctx.fillStyle='rgba(8,10,30,0.88)';ctx.fill();ctx.strokeStyle=GOLD;ctx.lineWidth=4;ctx.stroke();
    const px=seg(t,4.9,7.6);ctx.strokeStyle='#fff';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(150,1460);ctx.lineTo(930,1460);ctx.stroke();
    ctx.fillStyle=GOLD;ctx.beginPath();ctx.arc(150,1460,18,0,7);ctx.fill();ctx.fillStyle=EMBER;ctx.beginPath();ctx.arc(150+780*ease(px),1460,18,0,7);ctx.fill();
    T('c. 1025',150,1510,40,GOLD,{w:600});T('2026',930,1510,40,'#fff',{w:600});
    T('~'+Math.round(1000*ease(px)).toLocaleString('en-US')+' TAHUN',CX,1340,130,'#fff',{w:700,stroke:{w:8,c:'#000'}});ctx.restore()}
};
// 5 COMPOUNDS
function mol(x,y,s,seed,t,prog,col){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.rotate(Math.sin(t*0.6+seed)*0.12);
  const pts=[];for(let i=0;i<6;i++){const a=i*Math.PI/3-Math.PI/6;pts.push([Math.cos(a)*90,Math.sin(a)*90])}
  const ext=[[1,170,-130],[2,170,70],[4,-170,60],[5,-120,-170],[0,230,-20]];
  ctx.lineWidth=8;ctx.strokeStyle=col;ctx.lineCap='round';
  const total=pts.length+ext.length;let drawn=prog*total;
  for(let i=0;i<6;i++){if(drawn<i)break;const k=clamp(drawn-i);const a=pts[i],b=pts[(i+1)%6];ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(lerp(a[0],b[0],k),lerp(a[1],b[1],k));ctx.stroke()}
  ext.forEach(([i,ex,ey],j)=>{const k=clamp(drawn-6-j);if(k<=0)return;const a=pts[i];ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(lerp(a[0],ex,k),lerp(a[1],ey,k));ctx.stroke();if(k>0.95){ctx.fillStyle=j%2?GOLD:EMBER;ctx.beginPath();ctx.arc(ex,ey,20+Math.sin(t*4+j)*3,0,7);ctx.fill()}});
  pts.forEach((p,i)=>{if(drawn>i){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p[0],p[1],11,0,7);ctx.fill()}});ctx.restore()}
S[4]=t=>{
  grad('#06192a','#14264f');stars(t,40,19,700);dust(t,25,'#7be0ff',31,-20);
  T('SEBATIAN YANG DIKAJI',CX,260,84,'#fff',{w:700,ls:6,a:ease(seg(t,0.1,0.5)),stroke:{w:7,c:'#000'}});
  const sc1=back(seg(t,0.4,0.9)),sc2=back(seg(t,1.6,2.1));
  ctx.save();ctx.globalAlpha=clamp(sc1);rr(80,420,920,520,40);ctx.fillStyle='rgba(255,255,255,0.05)';ctx.fill();ctx.strokeStyle=EMBER;ctx.lineWidth=4;ctx.stroke();ctx.restore();

  ctx.strokeStyle=GOLD;ctx.lineWidth=3;ctx.globalAlpha=ease(seg(t,1.0,1.6));ctx.beginPath();ctx.moveTo(CX-300,1185*1);ctx.lineTo(CX+300,1185);ctx.stroke();ctx.globalAlpha=1;
  T('DISCOVER THE GOLDEN HERITAGE',CX,1250,46,CREAM,{ls:7,w:400,a:ease(seg(t,1.3,1.9))});
};

/* ---------- subtitles ---------- */
const SUB=[];const SF=62;
function layoutSubs(){ctx.font=`600 ${SF}px Oswald,sans-serif`;ctx.letterSpacing='1px';
  TL.scenes.forEach(sc=>{const words=sc.text.toUpperCase().split(' ');const lines=[];let cur=[];let w=0;
    words.forEach(wd=>{const mw=ctx.measureText(wd+' ').width;if(w+mw>880&&cur.length){lines.push(cur);cur=[];w=0}cur.push([wd,mw]);w+=mw});lines.push(cur);
    const tot=words.reduce((s,x)=>s+x.length+1.5,0);let acc=0;const items=[];
    lines.forEach((ln,li)=>{const lw=ln.reduce((s,x)=>s+x[1],0);let x=CX-lw/2;ln.forEach(([wd,mw])=>{const st=sc.vs+(acc/tot)*sc.vd;acc+=wd.length+1.5;items.push({wd,x,li,pg:Math.floor(li/2),row:li%2,st,mw});x+=mw})});
    SUB.push({sc,items,n:lines.length})})}
function drawSubs(t){const idx=TL.scenes.findIndex(s=>t>=s.start&&t<s.end);if(idx<0)return;const {sc,items}=SUB[idx];if(t<sc.vs-0.05||t>sc.vs+sc.vd+0.25)return;
  const fade=ease(seg(t,sc.vs-0.05,sc.vs+0.15))*(1-seg(t,sc.vs+sc.vd+0.05,sc.vs+sc.vd+0.25));
  let pg=0;items.forEach(it=>{if(t>=it.st)pg=it.pg});const pageItems=items.filter(it=>it.pg===pg);const rows=Math.max(...pageItems.map(i=>i.row))+1;
  ctx.save();ctx.globalAlpha=fade;const y0=(rows===1?1745:1710);ctx.font=`600 ${SF}px Oswald,sans-serif`;ctx.textAlign='left';ctx.textBaseline='middle';ctx.letterSpacing='1px';
  pageItems.forEach(it=>{const on=t>=it.st;const pop=on?1+0.18*Math.max(0,1-(t-it.st)*6):1;const y=y0+it.row*80;ctx.save();ctx.translate(it.x+it.mw/2,y);ctx.scale(pop,pop);ctx.translate(-it.mw/2,0);
    ctx.lineWidth=14;ctx.lineJoin='round';ctx.strokeStyle='rgba(0,0,0,0.92)';ctx.strokeText(it.wd,0,0);ctx.fillStyle=on?GOLD:'rgba(255,255,255,0.92)';ctx.fillText(it.wd,0,0);ctx.restore()});ctx.restore()}

/* ---------- render ---------- */
function drawScene(i,t){ctx.save();ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();S[i](t);ctx.restore()}
function render(t){
  ctx.clearRect(0,0,W,H);
  const i=Math.max(0,TL.scenes.findIndex(s=>t>=s.start&&t<s.end));const sc=TL.scenes[i];const TR=0.45;
  if(i>0&&t<sc.start+TR){const prev=TL.scenes[i-1];drawScene(i-1,prev.end-prev.start+(t-sc.start));
    const k=ease((t-sc.start)/TR),r=k*1500;ctx.save();ctx.beginPath();ctx.arc(CX,H*0.5,r,0,7);ctx.clip();drawScene(i,t-sc.start);ctx.restore();
    ctx.strokeStyle=GOLD;ctx.lineWidth=14*(1-k)+2;ctx.globalAlpha=1-k*0.8;ctx.beginPath();ctx.arc(CX,H*0.5,r,0,7);ctx.stroke();ctx.globalAlpha=1}
  else drawScene(i,t-sc.start);
  const vg=ctx.createRadialGradient(CX,H*0.5,H*0.3,CX,H*0.5,H*0.75);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.5)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  drawSubs(t);
  ctx.fillStyle='rgba(255,255,255,0.15)';ctx.fillRect(0,0,W,6);ctx.fillStyle=GOLD;ctx.fillRect(0,0,W*t/TL.total,6);
  const fo=1-seg(t,TL.total-0.5,TL.total);if(fo<1){ctx.fillStyle=`rgba(0,0,0,${1-fo})`;ctx.fillRect(0,0,W,H)}
}
window.ready=(async()=>{await document.fonts.load('700 60px Oswald');await document.fonts.load('600 60px Oswald');await logo.decode().catch(()=>{});layoutSubs();render(0);return true})();
window.render=render;window.frameURL=(t)=>{render(t);return C.toDataURL('image/jpeg',0.92)};
// live preview
if(!navigator.webdriver){window.ready.then(()=>{const t0=performance.now();(function loop(){render(((performance.now()-t0)/1000)%TL.total);requestAnimationFrame(loop)})()})}
</script>
